name: 'Code Per Day SVG'
description: 'Generate one SVG profile card: daily code additions/deletions, a KLOC tech stack leaderboard and top-language donuts'
author: 'MPGE'
branding:
  icon: 'bar-chart-2'
  color: 'green'

inputs:
  github_token:
    description: 'GitHub token; the card is generated for its owner. Use a PAT with `repo` scope to include private repositories.'
    required: true
  theme:
    description: 'Chart theme (dark, light, dracula, tokyonight, nord, ocean, sunset, forest, midnight, radical, transparent, github-dark)'
    required: false
    default: 'dark'
  period:
    description: 'Number of days to chart (e.g. 30, 90, 365)'
    required: false
    default: '30'
  output_path:
    description: 'Output directory for the generated profile-card-<theme>.svg'
    required: false
    default: './code-per-day'
  all_themes:
    description: 'Generate an SVG for every built-in theme'
    required: false
    default: 'false'
  chart_type:
    description: 'Style of the code-per-day chart: bars, area'
    required: false
    default: 'bars'

outputs:
  svg_path:
    description: 'Path to the generated SVG file (or directory when all_themes is true)'

runs:
  using: 'node20'
  main: 'dist/index.js'
